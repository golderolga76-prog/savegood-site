name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
  workflow_dispatch:

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 90

      - name: Submit URLs to IndexNow
        shell: bash
        run: |
          cat > payload.json <<'JSON'
          {
            "host": "savegood.store",
            "key": "7f2a9c4e6b1d83f05a7c2e9b4d6f18a3",
            "keyLocation": "https://savegood.store/7f2a9c4e6b1d83f05a7c2e9b4d6f18a3.txt",
            "urlList": [
              "https://savegood.store/",
              "https://savegood.store/ukrainians-in-europe",
              "https://savegood.store/cheap-flights-europe",
              "https://savegood.store/hotels-in-europe",
              "https://savegood.store/find-cheaper-products",
              "https://savegood.store/ai-services",
              "https://savegood.store/nashi-servisy",
              "https://savegood.store/dzlegko-telegram-bot",
              "https://savegood.store/dopomoga-z-domashnim-zavdanniam",
              "https://savegood.store/perevirka-domashnoho-zavdannia-po-foto",
              "https://savegood.store/dopomoga-z-matematykoiu-5-9-klas",
              "https://savegood.store/pryklady-zavdan-po-foto",
              "https://savegood.store/dopomoga-z-ukrainskoiu-movoiu-5-9-klas",
              "https://savegood.store/dopomoga-z-istorii-po-foto",
              "https://savegood.store/yak-pereviryty-domashnie-zavdannia-dytyny",
              "https://savegood.store/ai-assistant-telegram-bot",
              "https://savegood.store/pryklady-ai-assistant",
              "https://savegood.store/video-bot",
              "https://savegood.store/pryklady-ai-video-bot",
              "https://savegood.store/pro-savegood",
              "https://savegood.store/privacy",
              "https://savegood.store/terms",
              "https://savegood.store/contact",
              "https://savegood.store/flights",
              "https://savegood.store/hotels",
              "https://savegood.store/find-cheaper"
            ]
          }
          JSON

          status=$(curl -sS -o response.txt -w "%{http_code}"             -X POST "https://api.indexnow.org/indexnow"             -H "Content-Type: application/json; charset=utf-8"             --data-binary @payload.json)

          cat response.txt || true
          echo "IndexNow HTTP status: $status"

          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            exit 1
          fi
